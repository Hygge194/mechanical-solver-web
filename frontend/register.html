<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng Ký - MechaMix</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #050c18;
  --bg2:      #07111f;
  --bg3:      #0b1829;
  --bg4:      #0f2038;
  --blue:     #1e6fff;
  --cyan:     #00d4ff;
  --teal:     #00c9a7;
  --tx1:      #e2e8f0;
  --tx2:      #7a93b4;
  --bdr:      rgba(30,111,255,0.14);
  --font:     'Plus Jakarta Sans', sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  font-family: var(--font);
  color: var(--tx1);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

body::before {
  content:'';
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 90% 60% at 5% 0%, rgba(0,212,255,0.09) 0%,transparent 55%),
    radial-gradient(ellipse 60% 50% at 95% 100%, rgba(30,111,255,0.07) 0%,transparent 50%);
}

.auth-card {
  background: rgba(11, 24, 41, 0.7);
  backdrop-filter: blur(16px);
  border: 1px solid var(--bdr);
  border-radius: 20px;
  width: 420px;
  padding: 40px;
  position: relative;
  z-index: 1;
  box-shadow: 0 15px 50px rgba(0,0,0,0.5);
  animation: fadeUp 0.5s ease both;
}

.logo {
  text-align: center;
  font-size: 24px;
  font-weight: 800;
  margin-bottom: 24px;
}
.logo em { font-style:normal; color:var(--cyan); }

.form-group {
  margin-bottom: 20px;
}
.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--tx2);
  margin-bottom: 8px;
}
.form-group input {
  width: 100%;
  background: var(--bg4);
  border: 1px solid var(--bdr);
  padding: 12px 16px;
  border-radius: 10px;
  color: var(--tx1);
  font-family: var(--font);
  outline: none;
  transition: all 0.2s;
}
.form-group input:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 2px rgba(0,212,255,0.1);
}

.btn-submit {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(135deg, var(--cyan), var(--blue));
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 4px 18px rgba(0,212,255,0.35);
  margin-top: 10px;
}
.btn-submit:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(0,212,255,0.5);
}

.auth-footer {
  text-align: center;
  margin-top: 24px;
  font-size: 13px;
  color: var(--tx2);
}
.auth-footer a {
  color: var(--blue);
  text-decoration: none;
  font-weight: 600;
  transition: color 0.2s;
}
.auth-footer a:hover { color: var(--cyan); }

.msg-box {
  font-size: 13px;
  margin-top: -10px;
  margin-bottom: 10px;
  display: none;
  text-align: center;
}
.msg-err { color: #ef4444; }
.msg-ok { color: #10b981; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="auth-card">
  <div class="logo">Mecha<em>Mix</em></div>
  <div id="msgBox" class="msg-box"></div>
  <form id="registerForm">
    <div class="form-group">
      <label>Họ và Tên</label>
      <input type="text" id="fullname" required>
    </div>
    <div class="form-group">
      <label>Tên đăng nhập</label>
      <input type="text" id="username" required minlength="4">
    </div>
    <div class="form-group">
      <label>Mật khẩu</label>
      <input type="password" id="password" required minlength="6">
    </div>
    <button type="submit" class="btn-submit" id="btnSubmit">TẠO TÀI KHOẢN</button>
  </form>
  <div class="auth-footer">
    Đã có tài khoản? <a href="login.html">Đăng nhập</a>
  </div>
</div>

<script>
  document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('btnSubmit');
    const f = document.getElementById('fullname').value;
    const u = document.getElementById('username').value;
    const p = document.getElementById('password').value;
    const msg = document.getElementById('msgBox');
    
    btn.textContent = 'Đang đăng ký...';
    btn.disabled = true;
    msg.style.display = 'none';
    msg.className = 'msg-box'; // reset

    try {
      const res = await fetch('http://localhost:8000/api/v1/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p, full_name: f })
      });
      const data = await res.json();
      if(res.ok && data.status === 'success') {
        msg.textContent = 'Đăng ký thành công! Vui lòng chờ...';
        msg.classList.add('msg-ok');
        msg.style.display = 'block';
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
      } else {
        msg.textContent = data.detail || data.message || 'Lỗi đăng ký';
        msg.classList.add('msg-err');
        msg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'TẠO TÀI KHOẢN';
      }
    } catch (error) {
      msg.textContent = 'Không thể kết nối đến máy chủ';
      msg.classList.add('msg-err');
      msg.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'TẠO TÀI KHOẢN';
    }
  });
</script>

</body>
</html>
